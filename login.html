<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Login - Parcial</title>
</head>
<body>
    <h2>Iniciar Sesión</h2>
    <form id="formLogin">
        <label>Usuario:</label><br>
        <input type="text" id="usuario" required><br><br>
        
        <label>Clave:</label><br>
        <input type="password" id="clave" required><br><br>
        
        <button type="submit">Ingresar</button>
    </form>
    <p id="mensaje" style="color: red;"></p>

    <script>
        document.getElementById("formLogin").addEventListener("submit", async (e) => {
            e.preventDefault();
            const data = {
                modulo: "login",
                usuario: document.getElementById("usuario").value,
                clave: document.getElementById("clave").value
            };

            const respuesta = await fetch('/', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            });
            const resultado = await respuesta.json();

            if (resultado.status === 'ok') {
                window.location.href = '/index.html'; // Entra al sistema principal si las credenciales son correctas
            } else {
                document.getElementById("mensaje").innerText = resultado.msg;
            }
        });
    </script>
</body>
</html>
