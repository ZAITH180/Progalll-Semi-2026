<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de impuestos a las actividades economicas</title>
    <!-- CSS -->
    <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/alertifyjs@1.14.0/build/css/alertify.min.css"/>
    <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/alertifyjs@1.14.0/build/css/themes/default.min.css"/>
    <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/alertifyjs@1.14.0/build/css/themes/semantic.min.css"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark px-3">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">::.. SISTEMA DE IMPUESTOS A LAS ACTIVIDADES ECONOMICAS ..::</a>
            <div class="collapse navbar-collapse show" id="mnxImpuestos">
                <div class="navbar-nav ms-auto">
                    <a class="nav-link text-white" href="#" data-form="clientes">Clientes</a>
                    <a class="nav-link text-white" href="#" data-form="productos">Productos</a>
                    <a class="nav-link text-white" href="#" data-form="usuarios">Usuarios</a>
                    <a class="nav-link text-white" href="#" data-form="busqueda_usuarios">Buscar Usuarios</a>
                </div>
            </div>
        </div>
    </nav>

    <div class="container-fluid mt-4">
        <div class="position-absolute" id="clientes"></div>
        <div class="position-absolute" id="busqueda_clientes"></div>
        <div class="position-absolute" id="productos"></div>
        <div class="position-absolute" id="busqueda_productos"></div>
        <div class="position-absolute" id="usuarios"></div>
        <div class="position-absolute" id="busqueda_usuarios"></div>
    </div>

    <!-- JavaScript -->
    <script src="https://code.jquery.com/jquery-4.0.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jqueryui/1.14.2/jquery-ui.js"></script>
    <script src="//cdn.jsdelivr.net/npm/alertifyjs@1.14.0/build/alertify.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", events=>{
            const mnx = document.getElementById('mnxImpuestos');
            if(mnx){
                mnx.addEventListener('click',e=>{
                    if(e.target.tagName === 'A'){
                        e.preventDefault();
                        let form = e.target.dataset.form;
                        if(form) cargarForm(form);
                    }
                });
            }
        });
        function cargarForm(form, callback){
            if( $(`#${form} > form`).length<=0 ){
                fetch(`/vistas?form=${form}`)
                .then(response => response.text())
                .then(ventana => {
                    $(`#${form}`).html(ventana).draggable();
                    cerrarVentana();
                    if(callback) callback();
                })
                .catch(error => console.error('Error al cargar el formulario:', error));
            }else{
                $(`#${form}`).show();
            }
        }
        function cerrarVentana(){
            $('.btn-close').off('click').on('click',e=>{
                e.preventDefault();
                let form = e.target.dataset.form;
                $(`#${form}`).hide();
            });
        }
    </script>
</body>
</html>
