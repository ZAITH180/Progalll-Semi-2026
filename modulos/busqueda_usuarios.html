<div class="card shadow p-3 mb-5 bg-body rounded" style="width: 650px; margin: 20px;">
    <div class="card-header bg-dark text-white d-flex justify-content-between align-items-center">
        <span>Búsqueda y Gestión de Usuarios</span>
        <button type="button" class="btn-close btn-close-white" data-form="busqueda_usuarios"></button>
    </div>
    <div class="card-body">
        <div class="input-group mb-3">
            <input type="text" class="form-control" id="txtBuscarUsuario" placeholder="Buscar por usuario o nombre...">
            <button class="btn btn-outline-secondary" type="button" onclick="buscarUsuarios()">Buscar</button>
        </div>
        <div class="table-responsive" style="max-height: 300px; overflow-y: auto;">
            <table class="table table-striped table-hover">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Usuario</th>
                        <th>Nombre</th>
                        <th>Teléfono</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody id="tablaUsuariosBody">
                    <!-- Aquí se cargan los resultados -->
                </tbody>
            </table>
        </div>
    </div>
</div>

<script>
    async function buscarUsuarios() {
        const busqueda = document.getElementById("txtBuscarUsuario").value;
        const respuesta = await fetch(`/usuarios?buscar=${busqueda}`);
        const datos = await respuesta.json();
        
        let html = "";
        datos.forEach(row => {
            // Esto previene el "undefined" sin importar si la BD devuelve objetos o arrays
            let id = row.idUsuario !== undefined ? row.idUsuario : (row[0] !== undefined ? row[0] : '');
            let usuario = row.usuario !== undefined ? row.usuario : (row[1] !== undefined ? row[1] : '');
            let clave = row.clave !== undefined ? row.clave : (row[2] !== undefined ? row[2] : '');
            let nombre = row.nombre !== undefined ? row.nombre : (row[3] !== undefined ? row[3] : '');
            let direccion = row.direccion !== undefined ? row.direccion : (row[4] !== undefined ? row[4] : '');
            let telefono = row.telefono !== undefined ? row.telefono : (row[5] !== undefined ? row[5] : '');

            html += `<tr>
                <td>${id}</td>
                <td>${usuario}</td>
                <td>${nombre}</td>
                <td>${telefono}</td>
                <td>
                    <button class="btn btn-sm btn-warning" onclick="cargarParaEditar(${id}, '${usuario}', '${clave}', '${nombre}', '${direccion}', '${telefono}')">Editar</button>
                    <button class="btn btn-sm btn-danger" onclick="eliminarUsuario(${id})">Eliminar</button>
                </td>
            </tr>`;
        });
        document.getElementById("tablaUsuariosBody").innerHTML = html;
    }

    async function eliminarUsuario(id) {
        if(confirm("¿Estás seguro de eliminar este usuario?")) {
            const datos = { modulo: "usuario", accion: "eliminar", idUsuario: id };
            const respuesta = await fetch('/', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(datos)
            });
            const resultado = await respuesta.json();
            alert(resultado.msg);
            buscarUsuarios();
        }
    }

    function cargarParaEditar(id, usuario, clave, nombre, direccion, telefono) {
        document.getElementById("idUsuario").value = id;
        document.getElementById("usuario").value = usuario;
        document.getElementById("clave").value = clave;
        document.getElementById("nombre").value = nombre;
        document.getElementById("direccion").value = direccion;
        document.getElementById("telefono").value = telefono;
        document.getElementById("accion").value = "modificar";
        alert("Usuario cargado en el formulario para modificar.");
    }

    // Cargar la tabla al abrir
    buscarUsuarios();
</script>
