<div class="card shadow p-3 mb-5 bg-body rounded" style="width: 450px; margin: 20px;">
    <div class="card-header bg-dark text-white d-flex justify-content-between align-items-center">
        <span>Gestión de Usuarios</span>
        <button type="button" class="btn-close btn-close-white" data-form="usuarios"></button>
    </div>
    <div class="card-body">
        <form id="formUsuarios">
            <input type="hidden" id="idUsuario" name="idUsuario">
            <input type="hidden" id="accion" name="accion" value="nuevo">
            <input type="hidden" id="modulo" name="modulo" value="usuario">

            <div class="mb-3">
                <label class="form-label">Usuario:</label>
                <input type="text" class="form-control" id="usuario" name="usuario" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Clave:</label>
                <input type="password" class="form-control" id="clave" name="clave" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Nombre:</label>
                <input type="text" class="form-control" id="nombre" name="nombre" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Dirección:</label>
                <input type="text" class="form-control" id="direccion" name="direccion" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Teléfono:</label>
                <input type="text" class="form-control" id="telefono" name="telefono" required>
            </div>

            <div class="d-flex justify-content-between">
                <button type="submit" class="btn btn-primary">Guardar</button>
            </div>
        </form>
    </div>
</div>

<script>
    document.getElementById("formUsuarios").addEventListener("submit", async function(e) {
        e.preventDefault();
        
        const datos = {
            modulo: document.getElementById("modulo").value,
            accion: document.getElementById("accion").value,
            idUsuario: document.getElementById("idUsuario").value,
            usuario: document.getElementById("usuario").value,
            clave: document.getElementById("clave").value,
            nombre: document.getElementById("nombre").value,
            direccion: document.getElementById("direccion").value,
            telefono: document.getElementById("telefono").value
        };

        const respuesta = await fetch('/', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(datos)
        });

        const resultado = await respuesta.json();
        alert(resultado.msg);
        document.getElementById("formUsuarios").reset();
    });
</script>
